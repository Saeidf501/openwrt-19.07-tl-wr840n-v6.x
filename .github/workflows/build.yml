name: Build OpenWrt WR840N v6.20

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_tl-wr840n-v6=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=1024

          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_uhttpd=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          CONFIG_IPV6=n
          CONFIG_PACKAGE_odhcp6c=n
          CONFIG_PACKAGE_odhcpd-ipv6only=n

          CONFIG_PACKAGE_ppp=n
          CONFIG_PACKAGE_opkg=n
          CONFIG_PACKAGE_openwrt-keyring=n
          CONFIG_PACKAGE_libpthread=n

          CONFIG_SIGNED_PACKAGES=n
          CONFIG_KERNEL_DEBUG_FS=n
          CONFIG_KERNEL_DEBUG_INFO=n
          CONFIG_KERNEL_KALLSYMS=n
          CONFIG_KERNEL_STRIP=y
          CONFIG_USE_SSTRIP=y
          EOF

          make defconfig

      - name: Build
        run: |
          make -j2 V=s

      - name: Check firmware
        run: |
          echo "===== Firmware ====="
          ls -lh bin/targets/ramips/mt76x8/*.bin
          echo "===== Size ====="
          du -h bin/targets/ramips/mt76x8/*.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: WR840N-v6-WireGuard
          path: bin/targets/ramips/mt76x8/*.bin
